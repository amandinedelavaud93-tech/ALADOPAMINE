<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>À LA DOPAMINE - Application Sportive Gamifiée</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase SDK JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root[data-theme="dark"] {
      --bg-dark: #050a14;
      --card-bg: rgba(10, 18, 32, 0.95);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --nav-bg: rgba(5, 10, 20, 0.9);
    }
    :root[data-theme="light"] {
      --bg-dark: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(0, 0, 0, 0.12);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --nav-bg: rgba(255, 255, 255, 0.9);
    }

    :root {
      --swim-blue: #00a2ff;
      --bike-orange: #ff6b00;
      --run-green: #22c55e;
      --walk-teal: #14b8a6;
      --hiit-pink: #ec4899;
      --race-red: #ef4444;
      --heart-red: #ef4444;
      --watts-purple: #a855f7;
      --xp-gold: #f59e0b;
      --purple-vip: #9333ea;
      
      --tier-iron-bg: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --tier-bronze-bg: linear-gradient(135deg, #b45309 0%, #78350f 100%);
      --tier-silver-bg: linear-gradient(135deg, #94a3b8 0%, #475569 100%);
      --tier-gold-bg: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --tier-plat-bg: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%);
      --tier-emerald-bg: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --tier-diamond-bg: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%);
      --tier-master-bg: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%);
      --tier-challenger-bg: linear-gradient(135deg, #f43f5e 0%, #9f1239 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background 0.3s ease, color 0.3s ease; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 162, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 107, 0, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; }

    header {
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
    }

    .navbar { display: flex; justify-content: space-between; align-items: center; height: 85px; flex-wrap: wrap; }
    .nav-brand-container { display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; color: var(--text-main); }
    .nav-brand span { color: var(--bike-orange); }

    .header-user-wrapper {
      display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border); border-radius: 10px; padding: 6px 12px; min-width: 130px;
    }
    .header-username { font-size: 0.8rem; font-weight: 800; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .header-userlevel { font-size: 0.75rem; font-weight: 800; color: #000; background: var(--xp-gold); padding: 3px 10px; border-radius: 6px; cursor: pointer; text-align: center; }

    .nav-menu { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; align-items: center; }
    .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: 600; font-size: 0.78rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .nav-menu a.active { color: var(--xp-gold); background: rgba(255, 107, 0, 0.1); border-bottom: 3px solid var(--bike-orange); }

    .btn-auth-header {
      background: linear-gradient(135deg, var(--bike-orange) 0%, #e65c00 100%);
      color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 0.78rem; cursor: pointer;
    }

    .app-page { display: block; animation: fadeIn 0.3s ease-in-out; }
    .app-page.hidden { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .hero-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin: 15px 0; }
    @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }

    .main-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; width: 90%; max-width: 440px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
    .form-group input { width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 0.85rem; }
    .btn-primary { background: var(--bike-orange); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--card-border); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; margin-top: 6px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="container navbar">
      <div class="nav-brand-container" onclick="showPage('home')">
        <div class="nav-brand">À LA <span>DOPAMINE</span></div>
        <div class="header-user-wrapper">
          <div class="header-username" onclick="openAuthModal()"><i class="fa-solid fa-user-gear"></i> <span id="header-user-name">Mon Compte</span></div>
          <span class="header-userlevel"><span id="header-user-level">Niv. 1</span></span>
        </div>
      </div>

      <ul class="nav-menu">
        <li><a id="nav-home" class="active" onclick="showPage('home')"><i class="fa-solid fa-house"></i> Accueil</a></li>
        <li><a id="nav-stats" onclick="showPage('stats')"><i class="fa-solid fa-chart-line"></i> Performance</a></li>
        <li><button class="btn-auth-header" onclick="openAuthModal()"><i class="fa-solid fa-right-to-bracket"></i> Connexion / Inscription</button></li>
      </ul>
    </div>
  </header>

  <div class="container" style="padding-top: 15px; padding-bottom: 25px;">
    <main id="view-home" class="app-page">
      <section class="hero-grid">
        <div class="main-box">
          <h2 style="font-size: 1.1rem; color: var(--bike-orange); margin-bottom: 10px;">🏆 Tableau de Bord Athlète</h2>
          <p style="font-size: 0.85rem; color: var(--text-sub);">Connectez votre compte pour sauvegarder vos entraînements, trophées et statistiques dans la base de données cloud.</p>
        </div>
        <div class="main-box">
          <h3 style="font-size: 0.95rem; margin-bottom: 8px;">Statut Supabase Cloud</h3>
          <div id="connection-status" style="font-size: 0.8rem; color: var(--run-green);"><i class="fa-solid fa-circle-check"></i> Prêt à être connecté</div>
        </div>
      </section>
    </main>
  </div>

  <!-- MODALE D'AUTHENTIFICATION SUPABASE -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
        <h3 style="color:var(--text-main); font-size:1rem;"><i class="fa-solid fa-user-shield" style="color:var(--bike-orange)"></i> Espace Authentification</h3>
        <button onclick="closeAuthModal()" style="background:none; border:none; color:var(--text-main); font-size:1.3rem; cursor:pointer;">&times;</button>
      </div>

      <div class="form-group">
        <label>Adresse E-mail</label>
        <input type="email" id="auth-email" placeholder="votre.email@exemple.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••">
      </div>

      <button class="btn-primary" onclick="handleSignIn()">Se Connecter</button>
      <button class="btn-secondary" onclick="handleSignUp()">Créer un compte</button>
    </div>
  </div>

  <script>
    // Config Supabase (Clés à configurer lors de l'étape Supabase)
    const SUPABASE_URL = 'https://votre-projet.supabase.co';
    const SUPABASE_ANON_KEY = 'votre-cle-anon';
    let supabase = null;

    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
    function showPage(pageId) {
      document.querySelectorAll('.app-page').forEach(page => page.classList.add('hidden'));
      document.getElementById(`view-${pageId}`)?.classList.remove('hidden');
    }

    async function handleSignUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert("Veuillez remplir les deux champs.");
      
      alert("Demande d'inscription enregistrée pour " + email);
      closeAuthModal();
    }

    async function handleSignIn() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert("Veuillez remplir les deux champs.");

      alert("Connexion réussie pour " + email);
      document.getElementById('header-user-name').innerText = email.split('@')[0];
      closeAuthModal();
    }
  </script>
</body>
</html>
